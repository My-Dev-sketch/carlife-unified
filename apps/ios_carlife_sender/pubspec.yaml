name: ios_carlife_sender
description: iPhone 15 Pro Max Wireless CarLife 60fps Sender for Chinese-spec Toyota Corolla Hybrid & BYD Qin Plus DiLink.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  carlife_protocol:
    path: ../../packages/carlife_protocol
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
